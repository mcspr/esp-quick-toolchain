name: Package 3.2.0-python3

on:
  workflow_dispatch:
    inputs:
      suffix:
        default: "v1"
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v7
        with:
          path: builder

      - name: esp8266/Arduino tools
        id: tools
        shell: bash
        env:
          ESP8266_ARDUINO_FILES: "package/package_esp8266com_index.template.json"
        run: |
          mkdir -p tools/
          pushd tools/

          ref=$(curl \
              -H "Authorization: Bearer ${{ github.token }}" \
              https://api.github.com/repos/esp8266/Arduino/git/refs/heads/master \
              | grep '"sha":' | awk '{ print $2 }' | tr -d '",')
          echo "ref=${ref}" >> $GITHUB_OUTPUT

          for fremote in ${ESP8266_ARDUINO_FILES} ; do
            flocal="${fremote##*/}"
            curl -v \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github.VERSION.raw" \
              -o "$flocal" \
              "https://api.github.com/repos/esp8266/Arduino/contents/${fremote}?ref=${ref}"
          done

          popd

      - name: Prepare latest blobs
        id: blobs
        run: |
          pushd builder

          export NOLOG=1

          echo mcspr > .ghuser
          echo mcspr > .ghtoken

          export PYTHON_RELEASE=$(make .tool.python-release)
          echo "python_release=${PYTHON_RELEASE}" >> $GITHUB_OUTPUT

          export PYTHON_VERSION=$(make .tool.python-version)
          echo "python_version=${PYTHON_VERSION}" >> $GITHUB_OUTPUT

          export REL=python${PYTHON_VERSION}
          export SUBREL=_${PYTHON_RELEASE}_${{ inputs.suffix }}

          make .tool.python-fetch
          make .tool.python

          popd

      - name: Package
        id: package
        shell: bash
        run: |
          pushd builder

          tag=python${{ steps.blobs.outputs.python_version }}_${{ steps.blobs.outputs.python_release }}_${{ inputs.suffix }}
          echo "tag=${tag}" >> $GITHUB_OUTPUT

          python patch_json.py \
            --pkgfile ${GITHUB_WORKSPACE}/tools/package_esp8266com_index.template.json \
            --tool python3 \
            --version "${tag}" \
            --glob 'package/*python*.json'

          popd

      - name: Description
        shell: bash
        run: |
          ref="https://github.com/esp8266/Arduino/commit/${{ steps.tools.outputs.ref }}"
          blobs="https://github.com/astral-sh/python-build-standalone/releases/tag/${{ steps.blobs.outputs.python_release }}"

          { echo "$(date +%y-%m-%d) - ${{ steps.package.outputs.tag }}"; \
            echo "esp8266/Arduino package index .json template for ${ref}"; \
            echo "Original Python blobs available at ${blobs}"; } \
          > release.md

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "builder/package/*.tar.gz,builder/package/*.zip,tools/package_esp8266com_index.template.json"
          bodyFile: release.md
          tag: ${{ steps.package.outputs.tag }}
          draft: true
