name: Repackage 3.2.0-gcc10.3

on:
  workflow_dispatch:
    inputs:
      suffix:
        default: v2
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v7
        with:
          path: builder

      - name: Checkout newlib 4.0.0
        uses: actions/checkout@v7
        with:
          path: newlib-xtensa-4.0.0
          repository: earlephilhower/newlib-xtensa
          ref: xtensa-4_0_0-lock-arduino
          submodules: false
          fetch-depth: 1

      - name: Tools
        id: tools
        shell: bash
        run: |
          mkdir -p tools/
          pushd tools/

          ref=$(curl \
              -H "Authorization: Bearer ${{ github.token }}" \
              https://api.github.com/repos/esp8266/Arduino/git/refs/heads/master \
              | grep '"sha":' | awk '{ print $2 }' | tr -d '",')
          echo "ref=${ref}" >> $GITHUB_OUTPUT

          for fremote in "package/package_esp8266com_index.template.json" "tools/get.py" ; do
            flocal="${fremote##*/}"
            curl \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github.VERSION.raw" \
              -o "$flocal" \
              "https://api.github.com/repos/esp8266/Arduino/contents/${fremote}?ref=${ref}"
          done

          # w/ current tree DarwinARM is the same as Darwin
          bash ${GITHUB_WORKSPACE}/builder/.github/scripts/unpack.sh ${GITHUB_WORKSPACE}/builder/package

          popd

          for d in ${GITHUB_WORKSPACE}/builder/package/* ; do
            pushd "$d"/xtensa-lx106-elf

            # hal blob intended for prefix, will be rebuilt
            rm -v lib/libhal.a

            # root directory contains at least one prefix header
            rm -vr include/xtensa

            # everything else is under target prefix
            bash ${GITHUB_WORKSPACE}/builder/.github/scripts/uninstall_newlib_4.0.0.sh \
              "${GITHUB_WORKSPACE}/newlib-xtensa-4.0.0" \
              ./xtensa-lx106-elf

            popd
          done

      - name: Prepare latest blobs
        run: |
          pushd builder

          export NOLOG=1
          export GCC=10.3

          cp -r package/pkg.LINUX.toolchain/xtensa-lx106-elf xtensa-lx106-elf.x86_64
          echo mcspr > .ghuser
          echo mcspr > .ghtoken

          make .stage.newlib.patch

          make -W .stage.LINUX.gcc1-make -j$(nproc) \
            .stage.LINUX.newlib-make \
            .stage.LINUX.hal-make

          popd

      - name: Install newlib
        shell: bash
        run: |
          pushd builder/arena.x86_64/newlib

          export PATH="${GITHUB_WORKSPACE}/builder/xtensa-lx106-elf.x86_64/bin:${PATH}"
          for d in ${GITHUB_WORKSPACE}/builder/package/* ; do
            make prefix="$d"/xtensa-lx106-elf install
          done

          popd

      - name: Install lx106-hal
        shell: bash
        run: |
          pushd builder/arena.x86_64/lx106-hal

          export PATH="${GITHUB_WORKSPACE}/builder/xtensa-lx106-elf.x86_64/bin:${PATH}"
          for d in ${GITHUB_WORKSPACE}/builder/package/* ; do
            make prefix="$d"/xtensa-lx106-elf/xtensa-lx106-elf install
          done

          popd

      - name: Generate archives and refresh package index .json
        id: package
        shell: bash
        run: |
          pushd builder

          # for the most part, this is still a previous release
          export GCC=10.3
          export REL=3.2.0
          export SUBREL=""
          export PKGREL_MAJOR=2

          # current makefile separates release tagging from the core
          export DATESTAMP=$(date --utc +%y%m%d)
          export TAG=${REL}-gcc10.3-${DATESTAMP}-${{ inputs.suffix }}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          for t in LINUX LINUX32 ARM64 RPI WIN64 WIN32 MACOSX86 ; do
            make -W .stage.${t}.done \
              install=package/pkg.${t}.toolchain/xtensa-lx106-elf \
              .toolchain.${t}.package-json

            # macOS binaries from repack are still compatible w/ 10.10
            # target archive MACOSX86 is a stand-in for MACOSARM
            make_opts=""
            if [[ "$t" = "MACOSX86" ]] ; then
              make_opts="MACOSX86_HOST=x86_64-apple-darwin14"
            fi

            make ${make_opts} .toolchain.${t}.archive
          done

          make \
            VERSION=${TAG} \
            ARDUINO_PKGFILE=${GITHUB_WORKSPACE}/tools/package_esp8266com_index.template.json \
            .arduino.toolchain-template-json

          popd

      - name: Description
        shell: bash
        run: |
          ref="https://github.com/esp8266/Arduino/commit/${{ steps.tools.outputs.ref }}"
          blobs="https://github.com/earlephilhower/esp-quick-toolchain/releases/tag/3.2.0-gcc10.3"

          { echo "$(date +%Y-%m-%d) - gcc10.3 for ESP8266 Core 3.2.0 (${{ steps.package.outputs.tag }})"; \
            echo "esp8266/Arduino package index .json template for ${ref}"; \
            echo "Original esp-quick-toolchain blobs available at ${blobs}"; } \
          > release.md

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "builder/package/*.tar.gz,builder/package/*.zip,tools/package_esp8266com_index.template.json"
          bodyFile: release.md
          draft: true
          tag: ${{ steps.package.outputs.tag }}
