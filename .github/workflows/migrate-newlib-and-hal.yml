name: Repackage 3.2.0-gcc10.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v7
        with:
          path: builder

      - name: Checkout newlib 4.0.0
        uses: actions/checkout@v7
        with:
          path: newlib-xtensa-4.0.0
          repository: earlephilhower/newlib-xtensa
          ref: xtensa-4_0_0-lock-arduino
          submodules: false
          fetch-depth: 1

      - name: Toolchains
        shell: bash
        run: |
          mkdir -p toolchain/
          pushd toolchain/

          for fremote in "package/package_esp8266com_index.template.json" "tools/get.py" ; do
            flocal="${fremote##*/}"
            curl \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github.VERSION.raw" \
              -o "$flocal" \
              https://api.github.com/repos/esp8266/Arduino/contents/$fremote
          done

          # w/ current tree DarwinARM is the same as Darwin
          mkdir tmp
          bash ${GITHUB_WORKSPACE}/builder/.github/scripts/unpack.sh tmp

          for d in tmp/* ; do
            pushd "$d"

            # hal blob intended for prefix, will be rebuilt
            rm -v lib/libhal.a

            # root directory contains at least one prefix header
            rm -vr include/xtensa

            # everything else is under target prefix
            bash ${GITHUB_WORKSPACE}/builder/.github/scripts/uninstall_newlib_4.0.0.sh \
              "${GITHUB_WORKSPACE}/newlib-xtensa-4.0.0" \
              ./xtensa-lx106-elf

            popd
          done

      - name: Prepare latest blobs
        run: |
          pushd builder

          export NOLOG=1
          export GCC=10.3

          cp -r ${GITHUB_WORKSPACE}/toolchain/tmp/Linux.64 xtensa-lx106-elf.x86_64
          echo mcspr > .ghuser
          echo mcspr > .ghtoken

          make .stage.newlib.patch

          make -W .stage.LINUX.gcc1-make -j$(nproc) \
            .stage.LINUX.newlib-make \
            .stage.LINUX.hal-make

          popd

      - name: Install newlib
        shell: bash
        run: |
          pushd builder/arena.x86_64/newlib

          export PATH="${GITHUB_WORKSPACE}/builder/xtensa-lx106-elf.x86_64/bin:${PATH}"
          for d in ${GITHUB_WORKSPACE}/toolchain/tmp/* ; do
            make prefix="$d" install
          done

          popd

      - name: Install lx106-hal
        shell: bash
        run: |
          pushd builder/arena.x86_64/lx106-hal

          export PATH="${GITHUB_WORKSPACE}/builder/xtensa-lx106-elf.x86_64/bin:${PATH}"
          for d in ${GITHUB_WORKSPACE}/toolchain/tmp/* ; do
            make prefix="$d" install
          done

          popd

      - name: Repackage
        shell: bash
        run: |
          pushd builder
          mkdir package

          hash=$(git rev-parse --short ${{ github.sha }})

          popd

          date=$(date +%y%m%d)

          old_ver="5.100300.230224"
          new_ver="2.100300.${date}"

          bash ${GITHUB_WORKSPACE}/builder/.github/scripts/repack.sh \
            "${GITHUB_WORKSPACE}/toolchain/tmp" \
            "${GITHUB_WORKSPACE}/builder/package" \
            "$hash" \
            "$old_ver" \
            "$new_ver"

      - name: Generate .json fragments for package index
        shell: bash
        run: |
          pushd builder

          for f in package/* ; do
            # macos binaries from repack are still compatible w/ 10.10
            if [[ "$f" =~ "x86_64-apple-darwin14" ]] ; then
              make MACOSX86_HOST=x86_64-apple-darwin14 ${f}.json
            else
              make ${f}.json
            fi
          done

          python patch_json.py \
            --pkgfile ${GITHUB_WORKSPACE}/toolchain/package_esp8266com_index.template.json \
            --tool xtensa-lx106-elf-gcc \
            --version testing \
            --glob 'package/*.xtensa-lx106-elf-gcc*.json'

          popd

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "builder/package/*.tar.gz,builder/package/*.zip,toolchain/package_esp8266com_index.template.json"
          tag: testing
          draft: true
